services:
  db-service:                       # le nom du service = nom DNS dans le réseau
    image: ${REDIS_IMAGE}
    command: ["redis-server", "--appendonly", "yes"]   # persistance sur disque
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    image: ${APP_IMAGE}
    build: .
    # Plage de ports : chaque instance prend un port libre (8080, 8081, 8082)
    environment:
      REDIS_HOST: db-service
      REDIS_PORT: ${REDIS_PORT}
    depends_on:
      db-service:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  lb:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - app-network

networks:
  app-network:
    external: true

volumes:
  redis-data:
    name: redis-data
