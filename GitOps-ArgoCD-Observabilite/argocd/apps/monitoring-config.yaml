# Configuration d'observabilité versionnée : ServiceMonitors ArgoCD, règles d'alerte, dashboard Grafana.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: tp4
  source:
    repoURL: https://github.com/AyebFarah/DevOps.git
    targetRevision: main
    path: GitOps-ArgoCD-Observabilite/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
