
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: podinfo-prod
resources:
  - ../../base
  - loadgen.yaml
replicas:
  - name: podinfo
    count: 2
images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: 6.17.0
patches:
  - path: service-nodeport.yaml
  - target: { kind: Deployment, name: podinfo }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "TP4 GitOps - PROD v2"
