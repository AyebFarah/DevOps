# Overlay DEV : 1 réplica, version la plus récente (on y valide les nouvelles images).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: podinfo-dev
resources:
  - ../../base
replicas:
  - name: podinfo
    count: 1
images:
  - name: ghcr.io/stefanprodan/podinfo   # tag modifié par les commits de déploiement
    newTag: 6.17.0
patches:
  - target: { kind: Deployment, name: podinfo }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "TP4 GitOps - DEV"
