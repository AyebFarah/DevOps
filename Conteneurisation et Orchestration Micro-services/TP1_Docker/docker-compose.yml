services:
  db-service:
    image: ${REDIS_IMAGE}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    image: ${APP_IMAGE}
    build: .
    # No container_name: required for scaling.
    # Port range: each instance takes the next free host port.
    ports:
      - "${WEB_HOST_PORTS}:${WEB_CONTAINER_PORT}"
    environment:
      REDIS_HOST: db-service
      REDIS_PORT: ${REDIS_PORT}
    depends_on:
      db-service:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  lb:
    image: nginx:alpine
    ports:
      - "${LB_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    external: true   # created in Part 2 with: docker network create app-network

volumes:
  redis-data:
    name: redis-data